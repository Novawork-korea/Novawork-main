<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOVAWORK responsive verification</title><style>body{margin:20px;background:#ddd;font:14px system-ui}header{display:flex;gap:20px;align-items:center;margin-bottom:16px}main{display:flex;gap:24px;align-items:flex-start}iframe{display:block;height:800px;border:1px solid #999;background:white}pre{max-width:1100px;white-space:pre-wrap}</style></head><body><header><h1>반응형 검수</h1><label>페이지 <select id="page"><option value="index.html">홈</option><option value="services.html">솔루션</option><option value="contact.html">문의</option><option value="portal.html">포털 안내</option><option value="about.html">노바워크</option><option value="portfolio.html">구현 예시</option></select></label><button id="check">화면 검사</button></header><main><section><h2>320px</h2><iframe id="small" title="320px 모바일 화면" width="320" src="index.html"></iframe></section><section><h2>390px</h2><iframe id="phone" title="390px 모바일 화면" width="390" src="index.html"></iframe></section><section><h2>760px</h2><iframe id="tablet" title="760px 태블릿 화면" width="760" src="index.html"></iframe></section></main><pre id="result" role="status"></pre><script>const frames=[...document.querySelectorAll('iframe')];document.querySelector('#page').addEventListener('change',e=>frames.forEach(f=>f.src=e.target.value));document.querySelector('#check').addEventListener('click',()=>{document.querySelector('#result').textContent=JSON.stringify(frames.map(f=>{const d=f.contentDocument,w=f.contentWindow;return{width:w.innerWidth,document:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,h1:d.querySelector('h1')?.innerText,footer:d.querySelector('.site-footer')?.getBoundingClientRect().width,menu:d.querySelector('.menu-toggle')?.getAttribute('aria-expanded'),images:[...d.images].every(i=>i.complete&&i.naturalWidth>0),logo:d.querySelectorAll('.nw-logo-piece').length}}),null,2)});</script></body></html>
