\"44be05c7a3168b66c8d516a73efa9b34839f3533098dc4bc22c83a431fd7e872\",\n    \"js/modules/inquiry-form.js\": \"2195b83d1a8558666ef7934e7e7b874f542b1027c6ff98a3c0f799286e88015f\",\n    \"js/modules/site-reveal.js\": \"f1e22fc640d335c45a703bf740df0df90e2493a94ea4cf484e2a9efabaa162a0\",\n    \"js/modules/page-interactions.js\": \"d3489624300d5be52a2906bcf9faac98d2c17c4ac8648f98af4d137724b49198\",\n    \"js/boot/route-transition-boot.js\": \"e33331e7b0209be261741bfd36a8c154dd6dd5ffbfd8a876e0c6fa569bd58b25\",\n    \"js/boot/reveal-boot.js\": \"0eeab7e8823b600702e973fb21af620313dcd02a5acb4830eec194ce8c2739e7\",\n    \"js/vendor/ScrollTrigger.min.js\": \"b0b14d67b55b0c43c756ac0b106cfcb09d0879945f6ead64451065b0672916a2\",\n    \"js/vendor/gsap.min.js\": \"92bb9a96476f983d212a2bc4f54c889039c1696dd4461d40a736860938570fbb\",\n    \"js/site-core/03-enhance-v8-faq-search.js\": \"ce532dcf7392aed399ddb0ca2157155d0860002867a44757203bc62584e4aec1\",\n    \"js/site-core/01-core-ui.js\": \"9a9f6d6f7b5b311c720860dada65a202efbdae15f83d03bb4dee3a79a9dd00f6\",\n    \"js/site-core/02-enhance-v7-smooth-scroll.js\": \"ada70597a4f0a9101fa6b3e35d75812357b0c240d917514dc7f0485592465734\"\n  }\n}", "tests/fullpage.spec.cjs": "const { test, expect } = require('@playwright/test');\nconst fs = require('node:fs');\nconst originals = require('../logo-paths.json');\nconst source = require('../source-manifest.json');\n\nconst S = { sequence: '[data-nw-sequence]', pin: '.nw-sequence-pin',\n  logo: '[data-nw-logo-intro]', pieces: '.nw-intro-piece',\n  representatives: '[data-sequence-part=\"type\"],[data-sequence-part=\"nav\"],[data-sequence-part=\"row-two\"]' };\nconst distance = (a,b) => Math.hypot(...a.map((v,i) => v - b[i]));\nconst translationChange = (a,b) => Math.max(...a.map((v,i) => distance(v.xyz,b[i].xyz)));\n\nasync function settle(page) {\n  await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));\n}\nasync function nativeScroll(page, y) {\n  // Move only the browser's native scroll position; no timeline/control API is touched.\n  await page.evaluate(value => window.scrollTo({ top: value, left: 0, behavior: 'instant' }), y);\n  await expect.poll(() => page.evaluate(target => Math.abs(scrollY-target),Math.max(0,y))).toBeLessThan(1.1);\n  await settle(page);\n}\nasync function dimensions(page) {\n  return page.evaluate(() => {\n    const s = document.querySelector('[data-nw-sequence]');\n    const p = s.querySelector('.nw-sequence-pin');\n    const sr = s.getBoundingClientRect(), pr = p.getBoundingClientRect();\n    const header = document.querySelector('.site-header').getBoundingClientRect();\n    return { width: document.documentElement.clientWidth, height: innerHeight,\n      scrollWidth: document.documentElement.scrollWidth, y: scrollY,\n      header: { height: header.height, bottom: header.bottom },\n      section: { docTop: sr.top + scrollY, height: sr.height },\n      pin: { x: pr.x, y: pr.y, width: pr.width, height: pr.height,\n        position: getComputedStyle(p).position }, layout: s.dataset.layout,\n      maxY: document.documentElement.scrollHeight - innerHeight };\n  });\n}\nasync function moveThroughStage(page, fraction) {\n  const d = await dimensions(page);\n  if (d.layout === 'flow') {\n    await nativeScroll(page, Math.min(d.maxY, d.section.docTop + fraction * Math.max(0,d.pin.height-d.height)));\n  } else {\n    // Fractions identify viewing positions in the native section, not implementation keyframes.\n    await nativeScroll(page, Math.max(0, d.section.docTop-d.header.height+fraction*(d.section.height-d.pin.height)));\n  }\n  return dimensions(page);\n}\nasync function transforms(page, selector) {\n  return page.locator(selector).evaluateAll(elements => elements.map(el => {\n    const c = getComputedStyle(el), m = new DOMMatrixReadOnly(c.transform === 'none' ? undefined : c.transform);\n    const b = el.getBoundingClientRect();\n    return { key: el.dataset.sequencePart || el.dataset.piece, xyz: [m.m41,m.m42,m.m43],\n      matrix: Array.from(m.toFloat64Array()), opacity: Number(c.opacity),\n      box: { x:b.x,y:b.y,width:b.width,height:b.height } };\n  }));\n}\nasync function textGeometry(page) {\n  return page.evaluate(() => {\n    const pin = document.querySelector('.nw-sequence-pin');\n    const bounds = pin.getBoundingClientRect();\n    const scope = '.nw-sequence-top,.nw-sequence-bottom,.nw-sequence-intro,.nw-sequence-heading,.nw-site-nav,.nw-site-type,.nw-site-action,.nw-site-baseline,.nw-program-title,.nw-program-row,.nw-program-receipt';\n    const nodes = [], walker = document.createTreeWalker(pin, NodeFilter.SHOW_TEXT);\n    let node;\n    while ((node = walker.nextNode())) {\n      const el = node.parentElement;\n      if (!node.textContent.trim() || !el.closest(scope)) continue;\n      let opacity = 1, visible = true;\n      for (let p = el; p && p !== pin.parentElement; p = p.parentElement) {\n        const c = getComputedStyle(p); opacity *= Number(c.opacity);\n        if (c.display === 'none' || c.visibility === 'hidden') visible = false;\n      }\n      if (!visible || opacity < .95) continue;\n      const range = document.createRange(); range.selectNodeContents(node);\n      for (const r of range.getClientRects()) {\n        if (r.width < 1 || r.height < 1) continue;\n        nodes.push({ text: node.textContent.trim().slice(0,80),\n          group: el.closest(scope).className, x:r.x,y:r.y,right:r.right,bottom:r.bottom,\n          width:r.width,height:r.height });\n      }\n    }\n    const clipped = nodes.filter(r => r.x < bounds.x-2 || r.right > bounds.right+2 || r.y < bounds.y-2 || r.bottom > bounds.bottom+2);\n    const overlaps = [];\n    for (let i=0; i<nodes.length; i++) for (let j=i+1; j<nodes.length; j++) {\n      const a=nodes[i], b=nodes[j];\n      const w=Math.min(a.right,b.right)-Math.max(a.x,b.x), h=Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y);\n      if (w>3 && h>2 && w*h/Math.min(a.width*a.height,b.width*b.height)>.07)\n        overlaps.push({ a:a.text,b:b.text,groupA:a.group,groupB:b.group,width:w,height:h });\n    }\n    return { nodes,clipped,overlaps,pin:{x:bounds.x,y:bounds.y,width:bounds.width,height:bounds.height} };\n  });\n}\nasync function assertNoHorizontal(page) {\n  expect(await page.evaluate(() => document.documentElement.scrollWidth-document.documentElement.clientWidth),\n    'Native document must not have horizontal overflow').toBeLessThanOrEqual(1);\n}\nasync function capture(page, testInfo, name, fullPage=false) {\n  const file = testInfo.outputPath(name+'.png');\n  await page.screenshot({ path:file, fullPage, animations:'allow' });\n  await testInfo.attach(name, { path:file, contentType:'image/png' });\n}\n\ntest('native full-page assembly, original logo, geometry and navigation', async ({page,context,browser}, testInfo) => {\n  const evidence = { startedAt:new Date().toISOString(), project:testInfo.project.name,\n    browserVersion:browser.version(), sourceCommit:source.sourceCommit, sourceBranch:source.sourceBranch,\n    qaCommit:process.env.GITHUB_SHA || null, viewport:testInfo.project.use.viewport,\n    requestedReducedMotion:testInfo.project.use.reducedMotion,\n    blockedRequests:[], pageErrors:[], samples:[], notes:[], checks:[] };\n  page.on('pageerror', e => evidence.pageErrors.push(e.message));\n  await context.route('**/*', route => {\n    const req = route.request(), url = new URL(req.url());\n    if (url.origin !== 'http://127.0.0.1:4173' || !['GET','HEAD'].includes(req.method())) {\n      evidence.blockedRequests.push({url:url.origin+url.pathname,method:req.method()});\n      return route.abort('blockedbyclient');\n    }\n    return route.continue();\n  });\n  try {\n    await page.goto('/index.html', {waitUntil:'domcontentloaded'});\n    await expect(page.locator(S.sequence)).toHaveCount(1);\n    await expect(page.locator(S.logo)).toHaveCount(1);\n    await expect(page.locator('.assembly-demo,[data-build-chapter]')).toHaveCount(0);\n    expect(await page.locator(S.pieces).evaluateAll(xs => xs.map(x => x.getAttribute('d')))).toEqual(originals.paths);\n    evidence.nativeReducedMotion = await page.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches);\n    expect(evidence.nativeReducedMotion).toBe(testInfo.project.use.reducedMotion === 'reduce');\n    const logoStart = await transforms(page,S.pieces);\n    await capture(page,testInfo,'logo-start');\n    await page.waitForTimeout(850); // Real finite-animation time, never a mocked/seeked clock.\n    const logoMiddle = await transforms(page,S.pieces);\n    await capture(page,testInfo,'logo-middle');\n    await expect.poll(async () => (await transforms(page,S.pieces)).filter(x => x.opacity < .99 || Math.hypot(...x.xyz) > .1).length,\n      {timeout:4500}).toBe(0);\n    const logoComplete = await transforms(page,S.pieces);\n    expect(logoComplete).toHaveLength(17);\n    expect(Math.max(translationChange(logoStart,logoComplete),translationChange(logoMiddle,logoComplete)),\n      'Original logo must actually assemble even with reduced motion enabled').toBeGreaterThan(8);\n    await page.waitForTimeout(700);\n    expect(await transforms(page,S.pieces)).toEqual(logoComplete);\n    const logoBox = await page.locator(S.logo+' svg').boundingBox();\n    expect(logoBox.width).toBeGreaterThanOrEqual(Math.min(testInfo.project.use.viewport.width*.45,440));\n    await expect(page.getByRole('button',{name:/다시 보기|건너뛰기/})).toHaveCount(0);\n    await page.evaluate(() => document.fonts.ready);\n    await capture(page,testInfo,'logo-complete');\n    await assertNoHorizontal(page);\n    evidence.checks.push('original17paths','logo-real-motion','logo-finite-hold','native-reduced-motion-setting');\n\n    let d = await moveThroughStage(page,.02);\n    expect(Math.abs(d.pin.width-d.width),'Stage must fill native viewport width').toBeLessThanOrEqual(2);\n    expect(Math.abs(d.pin.x),'Stage must not be an inset demo box').toBeLessThanOrEqual(1);\n    if (d.layout === 'flow') {\n      expect(d.pin.position).not.toBe('sticky');\n      expect(d.pin.height).toBeGreaterThan(d.height-d.header.height);\n      evidence.notes.push('Short-height layout is deliberately readable ordinary flow, not a pinned animation; logo motion still tested.');\n      for (const [name,p] of [['flow-top',0],['flow-middle',.5],['flow-end',1]]) {\n        await moveThroughStage(page,p); await assertNoHorizontal(page);\n        await capture(page,testInfo,name);\n      }\n      const geometry=await textGeometry(page); evidence.samples.push({name:'flow-final-text',geometry});\n      expect(geometry.clipped,'Final ordinary-flow text cannot be clipped by the stage').toEqual([]);\n      expect(geometry.overlaps,'Final ordinary-flow text cannot overlap').toEqual([]);\n      expect((await transforms(page,S.representatives)).every(x => x.opacity > .99)).toBe(true);\n    } else {\n      expect(d.pin.position).toBe('sticky');\n      expect(Math.abs(d.pin.height-(d.height-d.header.height))).toBeLessThanOrEqual(2);\n      expect(Math.abs(d.pin.y-d.header.bottom)).toBeLessThanOrEqual(2);\n      let mid,assembled;\n      for (const [name,p] of [['intro',.02],['assembly-middle',.22],['website-complete',.40],['pullback-program',.57],['both-screens',.72],['connected-complete',.95]]) {\n        const measured = await moveThroughStage(page,p);\n        const poses = await transforms(page,S.representatives);\n        evidence.samples.push({name,nativeScrollY:measured.y,poses});\n        if (p===.22) mid=poses;\n        if (p===.40) assembled=poses;\n        await assertNoHorizontal(page); await capture(page,testInfo,name);\n        if (p===.40 || p===.95) {\n          const geometry=await textGeometry(page); evidence.samples.push({name:name+'-text',geometry});\n          expect(geometry.clipped,name+' text cannot be clipped by the stage').toEqual([]);\n          expect(geometry.overlaps,name+' text cannot overlap').toEqual([]);\n        }\n      }\n      expect(translationChange(mid,assembled),'Assembly must move substantially in 3D, not only fade or jiggle')\n        .toBeGreaterThan(Math.min(d.width,d.height)*.12);\n      await moveThroughStage(page,.22);\n      const reversed=await transforms(page,S.representatives);\n      expect(translationChange(mid,reversed),'Reverse scroll returns to the same assembly pose').toBeLessThan(1.5);\n      evidence.checks.push('meaningful-transform-distance','reverse-scroll-pose','fullviewport-single-placement');\n    }\n\n    // Native wheel input must move the document in both directions without a scroll trap.\n    await moveThroughStage(page,.55);\n    let y=await page.evaluate(() => scrollY);\n    await page.mouse.move(d.width/2,Math.min(d.height-30, d.header.height+130));\n    await page.mouse.wheel(0,Math.max(420,d.height*1.5));\n    await expect.poll(() => page.evaluate(() => scrollY)).toBeGreaterThan(y+50);\n    y=await page.evaluate(() => scrollY);\n    await page.mouse.wheel(0,-Math.max(420,d.height*1.5));\n    await expect.poll(() => page.evaluate(() => scrollY)).toBeLessThan(y-50);\n    await settle(page); await capture(page,testInfo,'native-fast-reverse');\n    expect(await page.evaluate(() => ['hidden','clip'].includes(getComputedStyle(document.documentElement).overflowY))).toBe(false);\n    evidence.checks.push('native-wheel-forward-reverse');\n\n    await moveThroughStage(page,.55);\n    const restoredY=await page.evaluate(() => scrollY);\n    const restoredPose=await transforms(page,S.representatives);\n    await page.reload({waitUntil:'load'});\n    await page.evaluate(() => document.fonts.ready); await settle(page);\n    await expect.poll(() => page.evaluate(y => Math.abs(scrollY-y),restoredY)).toBeLessThan(4);\n    expect(translationChange(restoredPose,await transforms(page,S.representatives))).toBeLessThan(2);\n    expect(await page.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches)).toBe(evidence.nativeReducedMotion);\n    await capture(page,testInfo,'middle-refresh-restored');\n\n    await page.goto('/about.html',{waitUntil:'load'});\n    expect(await page.locator(S.pieces).evaluateAll(xs => xs.map(x => x.getAttribute('d')))).toEqual(originals.paths);\n    await expect(page.locator(S.sequence)).toHaveCount(0);\n    await expect(page.locator(S.logo)).toHaveCount(0);\n    await assertNoHorizontal(page); await capture(page,testInfo,'about-static');\n    await page.goBack({waitUntil:'load'});\n    await page.evaluate(() => document.fonts.ready); await settle(page);\n    await expect.poll(() => page.evaluate(y => Math.abs(scrollY-y),restoredY)).toBeLessThan(8);\n    expect(translationChange(restoredPose,await transforms(page,S.representatives))).toBeLessThan(3);\n    await capture(page,testInfo,'history-back-restored');\n    evidence.checks.push('middle-refresh-native-restore','history-back-native-restore','about-no-duplicate-sequence');\n\n    const toggle=page.locator('.menu-toggle');\n    if (testInfo.project.use.viewport.width<=760) {\n      const before=await page.evaluate(() => ({y:scrollY,x:document.documentElement.style.overflowX,yStyle:document.documentElement.style.overflowY}));\n      await toggle.click(); await expect(toggle).toHaveAttribute('aria-expanded','true');\n      await expect(page.locator('#mobile-nav')).toBeVisible(); await capture(page,testInfo,'mobile-menu-open');\n      await page.keyboard.press('Tab');\n      expect(await page.evaluate(() => document.activeElement.closest('#mobile-nav,.menu-toggle')!==null)).toBe(true);\n      await page.keyboard.press('Escape'); await expect(toggle).toHaveAttribute('aria-expanded','false');\n      await expect(page.locator('#mobile-nav')).toBeHidden();\n      await expect(toggle).toBeFocused();\n      const box=await toggle.boundingBox();\n      for(let i=0;i<4;i++) await page.mouse.click(box.x+box.width/2,box.y+box.height/2);\n      await expect(toggle).toHaveAttribute('aria-expanded','false');\n      await expect(page.locator('#mobile-nav')).toBeHidden();\n      expect(await page.evaluate(() => ({y:scrollY,x:document.documentElement.style.overflowX,yStyle:document.documentElement.style.overflowY}))).toEqual(before);\n      expect(await page.locator('main[inert],footer[inert]').count()).toBe(0);\n      await capture(page,testInfo,'mobile-menu-rapid-close');\n      evidence.checks.push('menu-keyboard-focus','menu-rapid-toggle','menu-root-scroll-restoration');\n    } else { await expect(toggle).toBeHidden(); }\n    await assertNoHorizontal(page);\n    expect(evidence.pageErrors,'No uncaught application JavaScript error').toEqual([]);\n    expect(evidence.blockedRequests.filter(r=>!['GET','HEAD'].includes(r.method)),\n      'No request submission was attempted').toEqual([]);\n    evidence.checks.push('no-horizontal-overflow','no-live-submission','no-uncaught-page-errors');\n  } finally {\n    evidence.finishedAt=new Date().toISOString();\n    const file=testInfo.outputPath('native-evidence.json');\n    fs.writeFileSync(file,JSON.stringify(evidence,null,2));\n    await testInfo.attach('native-evidence',{path:file,contentType:'application/json'});\n  }\n});\n"}''')
          for name, content in files.items():
              target = Path('qa-native') / name
