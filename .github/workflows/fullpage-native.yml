ver((req,res) => {\n  if (!['GET','HEAD'].includes(req.method)) { res.writeHead(405); res.end(); return; }\n  let pathname;\n  try { pathname = decodeURIComponent(new URL(req.url, 'http://127.0.0.1').pathname); }\n  catch { res.writeHead(400); res.end(); return; }\n  const parts = pathname.split('/').filter(Boolean);\n  if (parts.some(p => p.startsWith('.') || ['qa-native','node_modules'].includes(p))) {\n    res.writeHead(403); res.end(); return;\n  }\n  const file = path.resolve(root, '.' + (pathname === '/' ? '/index.html' : pathname));\n  if (!file.startsWith(root + path.sep) || !mime[path.extname(file)]) { res.writeHead(404); res.end(); return; }\n  fs.readFile(file, (err,bytes) => {\n    if (err) { res.writeHead(404); res.end(); return; }\n    res.writeHead(200, { 'Content-Type': mime[path.extname(file)], 'Cache-Control':'no-store',\n      'Content-Security-Policy': \"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'\" });\n    res.end(req.method === 'HEAD' ? undefined : bytes);\n  });\n}).listen(4173, '127.0.0.1', () => console.log('QA static server: http://127.0.0.1:4173'));\n", "official-sources.json": "{\n  \"playwrightVersion\": \"1.64.0\",\n  \"sources\": [\n    \"https://playwright.dev/docs/test-configuration\",\n    \"https://playwright.dev/docs/test-use-options\",\n    \"https://playwright.dev/docs/ci-intro\",\n    \"https://www.npmjs.com/package/@playwright/test/v/1.64.0\"\n  ],\n  \"limitations\": [\n    \"Native desktop engines with viewport and motion preference settings; physical devices are not tested.\",\n    \"Analytics, forms and external requests blocked in CI.\"\n  ]\n}", "logo-paths.json": "{\n  \"paths\": [\n    \"M315 326 L450 721 L491 600 L398 326 Z\",\n    \"M599 327 L691 328 L684 337 L606 336 Z\",\n    \"M599 327 L448 752 L462 743 L606 336 Z M448 752 L531 752 L525 74